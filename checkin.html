<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참관 확인 · 매안초등학교 연구학교 보고회</title>
<link rel="stylesheet" href="assets/style.css?v=20261111a">
<script src="assets/config.js?v=20261111a"></script>
<script src="assets/common.js?v=20261111a"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body class="page-checkin">

<section class="band" id="ckHero">
  <div class="wrap">
    <h1>참관 확인</h1>
    <p>소속과 이름을 적고 직접 서명하면 참관증이 바로 만들어집니다. PDF로 저장하거나 인쇄할 수 있습니다.</p>
  </div>
</section>

<section class="sec" id="formView" style="padding-top:34px" hidden>
  <div class="wrap">
    <form class="ck-card" id="ckForm" novalidate>
      <div class="field"><label for="org">소속</label><input id="org" maxlength="30" placeholder="예) ○○초등학교" autocomplete="organization" required></div>
      <div class="field"><label for="name">성명</label><input id="name" maxlength="15" placeholder="예) 홍길동" autocomplete="name" required></div>
      <div class="field"><label>서명 <span style="font-weight:500;color:var(--ink-soft);font-size:.84rem">손가락이나 마우스로 직접 써 주세요</span></label>
        <div class="sig-box"><canvas id="sig" aria-label="서명 입력란"></canvas><div class="sig-ph" id="sigPh">여기에 서명하세요</div></div>
        <div class="sig-tools"><span class="sig-note">소속·성명·서명은 학교 참관 등록부에 함께 보관됩니다.</span><button type="button" id="sigClear">↺ 다시 쓰기</button></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn btn-act" style="width:100%;padding:14px;font-size:1.05rem" type="submit">참관증 받기</button>
    </form>
  </div>
</section>

<section class="sec" id="closedView" style="padding-top:34px" hidden>
  <div class="wrap"><div class="closed"><div class="big">🔒</div><h2 style="font:1.6rem var(--display);margin-bottom:8px">참관 확인은 보고회 당일에 열립니다</h2>
    <p class="muted" id="closedMsg">보고회 당일 이 화면에서 서명하고 참관증을 받을 수 있습니다.</p></div></div>
</section>

<section class="sec" id="certView" style="padding-top:28px" hidden>
  <div class="wrap">
    <div class="cert-actions">
      <button class="btn btn-act" id="btnPdf">PDF로 저장</button>
      <button class="btn btn-act" id="btnPrint">바로 인쇄</button>
      <button class="btn btn-line" id="btnBack">다시 작성</button>
    </div>
    <p class="cert-tip muted" style="text-align:center;margin:-6px 0 16px">휴대폰에서는 'PDF로 저장' 후 파일 앱/다운로드 폴더에서 확인할 수 있습니다.</p>
    <div class="cert-stage" id="certStage"><div class="cert-scale" id="certScale">
      <div class="cert" id="cert"><div class="cert-in">
        <h1 id="cTitle"></h1>
        <dl class="info">
          <dt>소속</dt><dd id="cOrg"></dd>
          <dt>성명</dt><dd><span id="cName"></span>
            <!-- 손 서명을 '(서명)' 글자 위에 겹쳐 표시 -->
            <span id="sigSpot" style="position:relative;display:inline-block;margin-left:auto;margin-right:26mm;font-size:11pt;color:#555;line-height:1">(서명)<img id="cSig" alt="서명" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;pointer-events:none"></span></dd>
        </dl>
        <div class="body" id="cBody"></div>
        <div class="date" id="cDate"></div>
        <div class="signer"><span id="cSigner"></span><span id="sealSlot"></span></div>
      </div></div>
    </div></div>
  </div>
</section>

<script>
const { CFG } = Maean;
Maean.renderChrome("checkin.html");
const $ = id => document.getElementById(id);

Maean.loadContent().catch(() => {}).then(() => {
  if (Maean.checkinOpen()){ $("formView").hidden = false; sizeCanvas(); addEventListener("resize", sizeCanvas); }
  else {
    $("closedView").hidden = false;
    if (CFG.EVENT_DATE_LABEL) $("closedMsg").textContent = `${CFG.EVENT_DATE_LABEL} 보고회 당일, 이 화면에서 서명하고 참관증을 받을 수 있습니다.`;
  }
});

/* ── 서명 패드 ── */
const cv = $("sig"), ctx = cv.getContext("2d");
let drawing = false, dirty = false, last = null;
function sizeCanvas(){
  const r = cv.getBoundingClientRect(), dpr = Math.max(2, devicePixelRatio || 1);
  const img = dirty ? cv.toDataURL() : null;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2.6;
  if (img){ const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, r.width, r.height); i.src = img; }
}
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); $("sigPh").hidden = true;
  ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, Math.PI*2); ctx.fillStyle = "#111"; ctx.fill(); dirty = true; });
cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e);
  ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; dirty = true; });
["pointerup", "pointercancel", "pointerleave"].forEach(t => cv.addEventListener(t, () => drawing = false));
$("sigClear").addEventListener("click", () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; $("sigPh").hidden = false; });

/* 서명 이미지를 잉크 부분만 잘라서 사용 */
function trimmedSignature(){
  const w = cv.width, h = cv.height, d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y*w + x)*4 + 3] > 10){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 <= x0) return cv.toDataURL();
  const pad = 12, c = document.createElement("canvas");
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
  c.width = x1 - x0; c.height = y1 - y0; c.getContext("2d").drawImage(cv, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return c.toDataURL("image/png");
}

/* 참관증 서명: 가로 45mm × 세로 17mm 안에 비율 그대로 맞춤 (PDF로 저장해도 찌그러지지 않게 크기를 직접 정함) */
function fitSignature(img, src){
  const MM = 96 / 25.4, W = 45 * MM, H = 17 * MM, probe = new Image();
  probe.onload = () => { const k = Math.min(W / probe.width, H / probe.height); img.style.width = probe.width * k + "px"; img.style.height = probe.height * k + "px"; img.src = src; };
  probe.src = src;
}

/* 등록부 보관용: 서명을 높이 90px 이하로 줄여 저장 (보통 5~15KB) */
function smallSignature(src){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 90 / img.height, 360 / img.width), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/png"));
    };
    img.onerror = () => res(""); img.src = src;
  });
}

/* ── 참관증 ── */
/* 참관 일자: 편집 페이지 설정에 따라 '등록한 날짜'(오늘) 또는 '지정한 날짜' */
function today(){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(CFG.CERT_DATE_MODE === "fixed" ? (CFG.CERT_DATE || "") : "");
  if (m) return `${+m[1]}년 ${+m[2]}월 ${+m[3]}일`;
  const d = new Date(); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}
function fitCert(){
  const stage = $("certStage"), avail = Math.min(stage.parentElement.clientWidth, 794);
  const s = avail / $("cert").offsetWidth;
  $("certScale").style.transform = `scale(${s})`;
  stage.style.width = avail + "px"; stage.style.height = $("cert").offsetHeight * s + "px";
}
function setSeal(){
  const slot = $("sealSlot"), img = new Image();
  img.className = "seal"; img.alt = "학교장 직인";
  img.onload = () => { slot.innerHTML = ""; slot.append(img); place(img); };
  img.onerror = () => { slot.innerHTML = `<span class="seal-ph">직인 이미지<br>자리</span>`; place(slot.firstChild); };
  if (!CFG.SEAL){ img.onerror(); return; }
  img.crossOrigin = "anonymous";            // PDF로 저장할 때 직인 이미지도 함께 담기 위해
  img.src = Maean.fileUrl(CFG.SEAL);
  function place(el){ const t = $("cSigner"); el.style.left = (t.offsetLeft + t.offsetWidth - 14) + "px"; }
}
$("ckForm").addEventListener("submit", e => {
  e.preventDefault();
  const org = $("org").value.trim(), name = $("name").value.trim();
  if (!org){ $("err").textContent = "소속을 입력해 주세요."; $("org").focus(); return; }
  if (!name){ $("err").textContent = "성명을 입력해 주세요."; $("name").focus(); return; }
  if (!dirty){ $("err").textContent = "서명을 해 주세요."; return; }
  $("err").textContent = "";
  $("cTitle").textContent = CFG.CERT_TITLE || "참 관 증";
  $("cOrg").textContent = org; $("cName").textContent = name;
  const sigFull = trimmedSignature();
  fitSignature($("cSig"), sigFull);
  $("cBody").textContent = CFG.CERT_BODY || "";
  $("cDate").textContent = today();
  $("cSigner").textContent = CFG.CERT_SIGNER || "";
  $("formView").hidden = true; $("ckHero").hidden = true; $("certView").hidden = false;
  scrollTo(0, 0); fitCert(); setSeal();
  smallSignature(sigFull).then(small => Maean.logCheckin(org, name, small));
});
addEventListener("resize", () => { if (!$("certView").hidden) fitCert(); });
$("btnBack").addEventListener("click", () => { $("certView").hidden = true; $("ckHero").hidden = false; $("formView").hidden = false; sizeCanvas(); });
$("btnPrint").addEventListener("click", () => { try { window.print(); } catch(e){ Maean.toast("이 환경에서는 인쇄를 열 수 없습니다."); } });
$("btnPdf").addEventListener("click", async () => {
  const btn = $("btnPdf"); btn.disabled = true; btn.textContent = "만드는 중…";
  try {
    await document.fonts.ready;
    const canvas = await html2canvas($("cert"), { scale: 2.5, backgroundColor: "#fff", useCORS: true,
      onclone: d => { d.getElementById("certScale").style.transform = "none"; d.getElementById("cert").style.boxShadow = "none"; } });
    const pdf = new jspdf.jsPDF({ orientation: "p", unit: "mm", format: "a4" });
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297);
    pdf.save(`참관증_${$("cName").textContent}.pdf`);
  } catch(e){ Maean.toast("PDF를 만들지 못했습니다. '바로 인쇄'에서 PDF로 저장을 선택해 주세요."); }
  btn.disabled = false; btn.textContent = "PDF로 저장";
});
</script>
</body>
</html>
