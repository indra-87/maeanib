<title>매안초 3D 학교 안내</title>
<!--
  매안초 3D 학교 안내 (보기 전용)
  ─────────────────────────────────────────────
  · 이 파일 하나로 동작합니다. three.js만 CDN에서 불러옵니다.
  · 건물 모양, 계단, 실 이름은 아래 MODEL 에 들어 있습니다. (편집 페이지에서 내보낸 값)
  · 방 이름을 누르면 ROOM_INFO[연결 코드] 내용을 소개 창으로 보여 줍니다. 연결 코드가 비어 있으면 실 이름을 코드로 씁니다.
      - 연결 코드는 편집 페이지의 '이름' 도구에서 이름표마다 정할 수 있습니다. 한글도 됩니다. (예: "1-1반", "도서관")
      - 각 이름표의 실제 연결 코드는 room.key 입니다. (= 연결 코드, 없으면 실 이름)
      - 코드가 없거나 ROOM_INFO 에 내용이 없으면 "준비 중" 안내가 뜹니다.
  · 편집 페이지에서 '누르면 수업 소개 띄우기'를 끈 이름표는 이름만 보이고 눌러도 반응하지 않습니다.
  · 다른 화면과 연결하려면:
      - window.onRoomClick = room => { ... ; return true }  // true 를 돌려주면 기본 소개 창을 띄우지 않음
      - iframe 안에 넣었다면 부모 창으로 postMessage({type:'maean3d:room', room}) 가 전달됩니다.
      - 주소 끝에 #f1 ~ #f5, #all 을 붙이면 그 층으로 바로 열립니다.
-->
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --fg:#1d2a2c; --muted:#66767a; --line:#d8e1df;
  --accent:#2d4fd1; --accent-ink:#ffffff; --tint:#eef1fb; --warm:#fdf0e6;
  --ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.chip{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  font:600 12.5px/1 var(--ui);color:var(--fg);background:rgb(255 255 255/.92);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;box-shadow:0 2px 6px rgb(0 0 0/.08);transition:background .15s,color .15s}
.chip.has{border-color:var(--accent)}
.chip.has::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.chip.static{pointer-events:none;cursor:default;background:rgb(255 255 255/.7);color:#55676b;font-weight:500;box-shadow:none}
.chip:hover,.chip:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.chip:hover::before,.chip:focus-visible::before{background:var(--accent-ink)}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px;box-shadow:0 8px 24px rgb(0 0 0/.08);max-width:calc(100vw - 24px)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:0;background:var(--tint);color:var(--fg);font:500 13px var(--ui);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg.small button{font-size:12px;padding:6px 10px;background:transparent;border:1px solid var(--line)}
.seg.small button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg)}
.hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:rgb(29 42 44/.78);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* room modal */
.mbg{position:fixed;inset:0;background:rgb(20 40 44/.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;
  padding:28px 30px 26px;box-shadow:0 20px 60px rgb(0 0 0/.25);display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mtag{display:inline-block;background:var(--tint);color:var(--accent);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:6px}
.mclose{border:0;background:#f0f3f2;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--fg);flex:none}
.modal h2{margin:0;font-size:24px;line-height:1.3;text-wrap:balance}
.rows{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
.rows dt{color:var(--muted)}
.rows dd{margin:0}
.note{background:var(--tint);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:14px;line-height:1.6}
.note b{display:block;color:var(--accent);font-size:13px;margin-bottom:4px}
.empty{color:var(--muted);line-height:1.6;margin:0}
.mfoot{display:flex;gap:10px;margin-top:4px}
.mfoot a,.mfoot button{flex:1;text-align:center;text-decoration:none;font:700 14.5px var(--ui);padding:13px;border-radius:10px;cursor:pointer}
.mfoot a{background:var(--accent);color:var(--accent-ink);flex:3}
.mfoot button{background:#fff;border:1px solid var(--line);color:var(--accent)}
@media (max-width:520px){.chip{font-size:11px;padding:4px 8px}.modal{padding:22px 20px}.modal h2{font-size:21px}.hint{font-size:11.5px}}
@media (max-width:420px){.chip{font-size:9.5px;padding:2px 5px}.chip.has::before{width:4px;height:4px;margin-right:3px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">

</div>
<div class="hint" id="hint">드래그해서 돌려 보고, 실 이름을 누르면 소개를 볼 수 있어요</div>

<div class="mbg" id="roomModal" hidden>

    <div id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

  f.walls.forEach(([a,b,c,d])=>{
    const len=Math.hypot(c-a,d-b)+S_T, geo=new THREE.BoxGeometry(len,H,S_T); geo.translate(0,H/2,0);
    const m=new THREE.Mesh(geo,mWall); m.position.set((a+c)/2,0,(b+d)/2); m.rotation.y=-Math.atan2(d-b,c-a);
    m.castShadow=m.receiveShadow=true; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat)); g.add(m);
  });
  f.stairs.forEach(s=>{
    const [ux,uz]=DIRS[s.r], ls=s.l/s.n;
    for(let k=0;k<s.n;k++){
      const h=s.h*(k+1)/s.n, off=-s.l/2+ls*(k+.5);
      const geo=ux?new THREE.BoxGeometry(ls*0.98,h,s.w):new THREE.BoxGeometry(s.w,h,ls*0.98);
      const m=new THREE.Mesh(geo,mStep); m.position.set(s.cx+ux*off,h/2,s.cz+uz*off); m.castShadow=m.receiveShadow=true; g.add(m);
    }
  });
  const chips=(f.labels||[]).filter(l=>!l.hidden).map(l=>{
    let b;
    if(l.noclick){ b=document.createElement('span'); b.className='chip static'; }   // name only, does nothing when pressed
    else { b=document.createElement('button'); b.type='button'; b.className='chip'+(ROOM_INFO[l.code||l.name]?' has':'');
      b.addEventListener('click',()=>roomClick({...l,key:l.code||l.name,floor:i+1})); }
    b.textContent=l.name;
    labelsEl.appendChild(b); return {el:b,v:new THREE.Vector3(l.x,0.3,l.z)};
  });
  return {g,chips};
});

// floors & views
let cur=0, showLabels=true, view='v3d', anim=null;
const LEVEL=H+SLAB+2;
const sel=document.getElementById('floorSel');
const opts=MODEL.floors.map((f,i)=>[String(i),f.name]).concat([['all','전체']]);
opts.forEach(([v,t])=>{const b=document.createElement('button'); b.dataset.f=v; b.textContent=t; b.addEventListener('click',()=>pick(v==='all'?'all':+v)); sel.appendChild(b);});
function viewFor(id){
  const top=cur==='all'?LEVEL*(floors.length-1)+H:0, mid=top*0.45;
  // 학교 배치도와 같은 방향(가로)으로 항상 보여 줍니다. 화면이 좁거나 세로로 길면 건물 폭이 다 들어오도록 카메라를 뒤로 뺍니다.
  const v=cur==='all'?(id==='vtop'?[[0,110+top,0.01],[0,top,0]]:[[-34,78+top,100+top*0.5],[0,mid,2]])
                     :(id==='vtop'?[[0,95,0.01],[0,0,0]]:[[-20,62,68],[0,0,2]]);
  const ref=Math.tan(20*Math.PI/180)*1.8, now=Math.tan(camera.fov*Math.PI/360)*camera.aspect, k=Math.max(1,ref/now);
  const [p,t]=v; return [[t[0]+(p[0]-t[0])*k,t[1]+(p[1]-t[1])*k,t[2]+(p[2]-t[2])*k],t];
}
function go(id,instant){
  view=id; ['v3d','vtop'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===id)));
  const [p,t]=viewFor(id), tt=new THREE.Vector3(...t), to=new THREE.Vector3(...p);
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(to);controls.target.copy(tt);return}
  anim={fp:camera.position.clone(),ft:controls.target.clone(),to,tt,t0:performance.now()};
}
function pick(v,instant){
  cur=v;
  sel.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===String(v))));
  floors.forEach((f,i)=>{ f.g.visible=v==='all'||v===i; f.g.position.y=v==='all'?i*LEVEL:0; });
  try{history.replaceState(null,'',v==='all'?'#all':'#f'+(v+1))}catch(e){}
  go(view,instant);
}
document.getElementById('v3d').addEventListener('click',()=>go('v3d'));
document.getElementById('vtop').addEventListener('click',()=>go('vtop'));
const lbBtn=document.getElementById('lbBtn');
lbBtn.addEventListener('click',()=>{showLabels=!showLabels; lbBtn.setAttribute('aria-pressed',String(showLabels));});
function fromHash(){const h=location.hash.slice(1); if(h==='all') return 'all'; const m=/^f(\d)$/.exec(h); return m&&+m[1]<=floors.length?+m[1]-1:0;}
addEventListener('hashchange',()=>{const v=fromHash(); if(v!==cur) pick(v);});

// room click → info modal (or your own handler)
const modal=document.getElementById('roomModal'), mTag=document.getElementById('mTag'), mTitle=document.getElementById('mTitle'),
      mBody=document.getElementById('mBody'), mFoot=document.getElementById('mFoot');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastFocus=null;
function roomClick(room){
  try{ if(window.parent!==window) window.parent.postMessage({type:'maean3d:room',room},'*'); }catch(e){}
  if(typeof window.onRoomClick==='function' && window.onRoomClick(room)===true) return;
  const info=ROOM_INFO[room.key];
  mTag.textContent=info&&info.tag||`${room.floor}층`;
  mTitle.textContent=info&&info.title||room.name;
  let body='';
  if(info){
    if(info.rows&&info.rows.length) body+='<dl class="rows">'+info.rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')+'</dl>';
    if(info.note) body+=`<div class="note"><b>${esc(info.note.title||'')}</b>${esc(info.note.text||'')}</div>`;
  } else body=`<p class="empty">${esc(room.name)} 소개는 준비 중입니다.</p>`;
  mBody.innerHTML=body;
  mFoot.innerHTML=(info&&info.link?`<a href="${esc(info.link.href)}" target="_blank" rel="noopener">${esc(info.link.text||'자세히 보기 ↗')}</a>`:'')+'<button type="button" id="mOk">닫기</button>';
  document.getElementById('mOk').addEventListener('click',closeModal);
  lastFocus=document.activeElement; modal.hidden=false; document.getElementById('mClose').focus();
}
function closeModal(){ modal.hidden=true; if(lastFocus) lastFocus.focus(); }
document.getElementById('mClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) closeModal(); });

// hint fades after first interaction
const hint=document.getElementById('hint');
renderer.domElement.addEventListener('pointerdown',()=>{hint.style.opacity='0';},{once:true});

function fit(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.fov=w/h<1?50:40; camera.updateProjectionMatrix(); }
addEventListener('resize',fit); fit(); pick(fromHash(),true);

const tmp=new THREE.Vector3();
renderer.setAnimationLoop(now=>{
  if(anim){const k=Math.min(1,(now-anim.t0)/700),e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(anim.fp,anim.to,e); controls.target.lerpVectors(anim.ft,anim.tt,e); if(k===1)anim=null;}
  controls.update(); renderer.render(scene,camera);
  const W=innerWidth,Hh=innerHeight;
  floors.forEach((f,i)=>{
    const on=showLabels&&cur===i;
    f.chips.forEach(c=>{
      if(!on){ if(!c.el.hidden) c.el.hidden=true; return; }
      tmp.copy(c.v).project(camera);
      const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
      c.el.hidden=!vis; if(vis) c.el.style.transform=`translate(${(tmp.x+1)/2*W}px,${(1-tmp.y)/2*Hh}px) translate(-50%,-50%)`;
    });
  });
});
</script>
